# /etc/nginx/sites-available/admin.miodoctors.com
# Static React build. Certbot adds the HTTPS (443) block and redirect.

server {
    listen 80;
    listen [::]:80;
    server_name admin.miodoctors.com;

    root /var/www/miodoctors/admin/dist;
    index index.html;

    access_log /var/log/nginx/admin.miodoctors.access.log;
    error_log  /var/log/nginx/admin.miodoctors.error.log warn;

    # Security headers (the panel only talks to its own API).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.miodoctors.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Hashed build assets never change → cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: every route serves index.html (never cached).
    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
