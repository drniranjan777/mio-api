# /etc/nginx/sites-available/api.miodoctors.com
# Certbot adds the HTTPS (443) block and the HTTP→HTTPS redirect to this file.

limit_req_zone $binary_remote_addr zone=mio_api:10m rate=20r/s;

upstream mio_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.miodoctors.com;

    # CSV import is limited to 2 MB by the API; allow a little headroom.
    client_max_body_size 3m;

    access_log /var/log/nginx/api.miodoctors.access.log;
    error_log  /var/log/nginx/api.miodoctors.error.log warn;

    # Uploaded images (banners): served straight from disk.
    location /uploads/ {
        alias /var/www/miodoctors/uploads/;
        limit_except GET HEAD { deny all; }
        autoindex off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        try_files $uri =404;
    }

    location / {
        limit_req zone=mio_api burst=40 nodelay;

        proxy_pass http://mio_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
